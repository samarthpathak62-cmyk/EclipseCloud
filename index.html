<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eclipse Cloud | Premium High-Performance Minecraft Hosting</title>
    <meta name="description" content="Order high performance Minecraft server hosting with instant Discord-guided onboarding, 99.99% uptime, and dedicated hardware." />
    <meta property="og:title" content="Eclipse Cloud | Premium High-Performance Minecraft Hosting" />
    <meta property="og:description" content="Order high performance Minecraft server hosting with instant Discord-guided onboarding, 99.99% uptime, and dedicated hardware." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('novacraft_cached_website_settings');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.browserTitle) {
              document.title = data.browserTitle;
            } else if (data && data.websiteName) {
              document.title = data.websiteName + ' | High-Performance Minecraft Server Hosting';
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 selection:bg-emerald-500 selection:text-white antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
